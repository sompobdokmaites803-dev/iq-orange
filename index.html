<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IQ Orange v6.1</title>
<style>
:root{--bg:#090b10;--p:#180f17;--p2:#21111b;--line:#5a2b3d;--tx:#fff2f6;--mut:#cda8b6;--o:#ff7a00;--g:#37d58a;--r:#ff6575;--y:#ffd166}
*{box-sizing:border-box}body{margin:0;background:#090b10;color:var(--tx);font-family:Inter,system-ui,-apple-system,"Noto Sans Thai",sans-serif}.wrap{max-width:1760px;margin:auto;padding:26px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--line);border-radius:24px}.hero{padding:26px 28px;display:flex;justify-content:space-between;gap:20px}.hero h1{font-size:46px;margin:4px 0 8px}.ey{font-size:16px;font-weight:1000}.sub{color:#e3bdca;font-size:18px;line-height:1.55}.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.chip{background:var(--o);padding:9px 14px;border-radius:12px;font-weight:1000}.btn{border:1px solid #cf6c8d;background:#9b3552;color:#fff;border-radius:18px;padding:18px 24px;font-size:26px;font-weight:1000;cursor:pointer}.statusbar{margin-top:12px;padding:10px 12px;border-radius:12px;background:#0e1319;border:1px solid #2b3744;color:#d6e0ea;font-size:14px}.summary{display:grid;grid-template-columns:1fr 1.25fr .75fr;gap:16px;margin-top:16px}.summary>.card{padding:22px}.lab{color:#d9afbd;font-size:12px;letter-spacing:.13em;font-weight:900}.pairbig{font-size:40px;font-weight:1000;margin-top:12px}.dirbig{font-size:32px;font-weight:1000}.call{color:var(--g)}.put{color:var(--r)}.timebig{font-size:72px;font-weight:1000;color:var(--o);line-height:1;margin:10px 0}.scorebig{font-size:96px;font-weight:1000;line-height:.9;margin-top:12px}.sectiontitle{margin:24px 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.sig{padding:20px}.head{display:flex;justify-content:space-between;gap:10px}.pname{font-size:28px;font-weight:1000}.badge{padding:7px 12px;border-radius:999px;font-weight:1000}.ready{background:#1f6f47}.watch{background:#6d5b17}.no{background:#6e2633}.score{font-size:72px;font-weight:1000}.line{margin-top:7px;color:#ffd3df;font-size:16px}.mut{color:#c098a8}#error{display:none;margin-top:12px;padding:12px;border-radius:12px;background:#411b24;color:#ffb1bd}
@media(max-width:1200px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:900px){.summary{grid-template-columns:1fr}.hero{flex-direction:column}.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap">
<section class="hero card"><div><div class="ey">STEP 1 REAL-TIME</div><h1>IQ ORANGE 5M v6.1</h1>
<div class="sub">แก้สำหรับ Twelve Data Basic 8: ใช้ 1 API call ต่อ 1 คู่ แล้วรวม 5m → 15m/1H ใน server</div>
<div class="chips"><span class="chip">8 PAIRS</span><span class="chip">8 CREDITS</span><span class="chip">5M</span></div>
<div id="apiStatus" class="statusbar">รอสแกนข้อมูล…</div></div><div><button id="scanBtn" class="btn">สแกน STEP 1</button><div id="error"></div></div></section>
<section class="summary"><div class="card"><div class="lab">คู่ดีที่สุด</div><div id="bestPair" class="pairbig">—</div><div id="bestDir" class="dirbig">NO TRADE</div></div>
<div class="card"><div class="lab">เวลาเตรียมเข้า</div><div id="planTime" class="timebig">--:--:--</div><div>รอ Snap Confirm ก่อนกด</div></div>
<div class="card"><div class="lab">STEP 1 SCORE</div><div id="bestScore" class="scorebig">0</div><div>/100</div><div>Risk: <b id="bestRisk">HIGH</b></div></div></section>
<div class="sectiontitle"><h2>STEP 1 · REAL-TIME FAST CHECK</h2></div><section id="grid" class="grid"></section>
<script>
const $=x=>document.getElementById(x);let data=[];
function cls(d){return d==='CALL'?'call':'put'}function badge(s){return s==='READY'?'ready':s==='WATCH'?'watch':'no'}
function render(){ $('grid').innerHTML=data.map(x=>`<article class="sig card"><div class="head"><div class="pname">${x.pair}</div><div class="badge ${badge(x.status)}">${x.status}</div></div><div><span class="score">${x.score}</span>/100</div><div class="line ${cls(x.direction)}"><b>${x.direction}</b></div><div class="line">Risk: <b>${x.risk}</b></div><div class="line mut">${x.reason}</div></article>`).join('');}
async function scan(){ $('scanBtn').disabled=true;$('scanBtn').textContent='SCANNING...';$('error').style.display='none';$('apiStatus').textContent='กำลังเรียก Twelve Data…';
try{let r=await fetch('/api/scan',{cache:'no-store'});let j=await r.json();if(!r.ok)throw new Error(j.error||'scan failed');data=j.top||[];$('apiStatus').textContent=`เชื่อมสำเร็จ · ได้ ${data.length} คู่ · API calls ${j.api_calls||0}/8`;render();if(data.length){let b=data[0];$('bestPair').textContent=b.pair;$('bestDir').textContent=b.direction+' · '+b.status;$('bestDir').className='dirbig '+cls(b.direction);$('planTime').textContent=b.entry_time;$('bestScore').textContent=b.score;$('bestRisk').textContent=b.risk}}
catch(e){$('error').textContent=e.message;$('error').style.display='block';$('apiStatus').textContent='เชื่อมข้อมูลไม่สำเร็จ'}finally{$('scanBtn').disabled=false;$('scanBtn').textContent='สแกน STEP 1'}}
$('scanBtn').onclick=scan;scan();
</script></main></body></html>
